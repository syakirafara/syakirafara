<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="ribbon divider">
<title>ribbon divider</title>
<defs>
<style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.35) rotate(0deg);opacity:.25}50%{transform:scale(1) rotate(25deg);opacity:1}}
.sway{animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.swing{animation:swing 5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.rise{animation:rise 11s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}80%{opacity:.45}100%{transform:translateY(-190px);opacity:0}}
.shine{animation:shine 5s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-160px)}55%,100%{transform:translateX(720px)}}
</style>

<linearGradient id="loopG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FDD7E4"/><stop offset=".45" stop-color="#F29BBB"/><stop offset="1" stop-color="#D45E8C"/>
</linearGradient>
<linearGradient id="tailG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="110">
  <stop offset="0" stop-color="#C94A7D"/><stop offset=".35" stop-color="#E37FA6"/><stop offset="1" stop-color="#F7B6CD"/>
</linearGradient>
<linearGradient id="knotG" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F8B4CC"/><stop offset="1" stop-color="#CF5687"/>
</linearGradient>
<g id="loopL">
  <path d="M-9 -6C-30 -50 -94 -56 -98 -16C-101 14 -62 30 -9 8Z" fill="url(#loopG)" stroke="#B9476F" stroke-opacity=".45" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M-9 2C-32 4 -58 2 -80 -8C-66 13 -36 19 -9 8Z" fill="#A83A66" opacity=".28"/>
  <path d="M-15 -15C-33 -43 -79 -48 -90 -23" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M-12 -3C-38 -16 -66 -20 -90 -12" fill="none" stroke="#A83A66" stroke-opacity=".22" stroke-width="1.3" stroke-linecap="round"/>
</g>
<g id="bow">
  <path d="M-7 7C-15 32 -30 64 -48 96L-31 89L-23 106C-12 74 -2 42 5 9Z" fill="url(#tailG)" stroke="#B9476F" stroke-opacity=".4" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M7 7C16 34 30 66 52 100L35 94L29 110C16 78 6 44 -3 9Z" fill="url(#tailG)" stroke="#B9476F" stroke-opacity=".4" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M-4 14C-10 34 -20 56 -32 80" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <path d="M5 14C12 36 22 58 36 82" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <use xlink:href="#loopL"/>
  <use xlink:href="#loopL" transform="scale(-1 1)"/>
  <rect x="-14" y="-15" width="28" height="30" rx="10" fill="url(#knotG)" stroke="#B9476F" stroke-opacity=".5" stroke-width="1.2"/>
  <path d="M-6 -11C-9 -4 -9 4 -6 11M6 -11C9 -4 9 4 6 11" fill="none" stroke="#9E2F60" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="-4" cy="-7" rx="5" ry="3" fill="#fff" opacity=".6"/>
</g>

<linearGradient id="dl" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="440" y2="0">
  <stop offset="0" stop-color="#D9578A" stop-opacity="0"/><stop offset="1" stop-color="#D9578A" stop-opacity=".9"/>
</linearGradient>
<linearGradient id="dr" gradientUnits="userSpaceOnUse" x1="960" y1="0" x2="560" y2="0">
  <stop offset="0" stop-color="#D9578A" stop-opacity="0"/><stop offset="1" stop-color="#D9578A" stop-opacity=".9"/>
</linearGradient>

</defs>

<path d="M40 28H462" stroke="url(#dl)" stroke-width="1.3"/>
<path d="M538 28H960" stroke="url(#dr)" stroke-width="1.3"/>
<path d="M60 28H450" stroke="url(#dl)" stroke-width="4.5" stroke-dasharray="0 22" stroke-linecap="round"/>
<path d="M940 28H550" stroke="url(#dr)" stroke-width="4.5" stroke-dasharray="0 22" stroke-linecap="round"/>
<g transform="translate(500 24) scale(.3)"><g class="sway"><use xlink:href="#bow"/></g></g>
<g transform="translate(430 12) scale(0.60)"><path class="tw" style="animation-delay:0s;animation-duration:3.0s" fill="#D9A15F" d="M0 -10C1.2 -2.6 2.6 -1.2 10 0C2.6 1.2 1.2 2.6 0 10C-1.2 2.6 -2.6 1.2 -10 0C-2.6 -1.2 -1.2 -2.6 0 -10Z"/></g><g transform="translate(570 12) scale(0.60)"><path class="tw" style="animation-delay:-1.5s;animation-duration:3.0s" fill="#D9A15F" d="M0 -10C1.2 -2.6 2.6 -1.2 10 0C2.6 1.2 1.2 2.6 0 10C-1.2 2.6 -2.6 1.2 -10 0C-2.6 -1.2 -1.2 -2.6 0 -10Z"/></g>

</svg>
