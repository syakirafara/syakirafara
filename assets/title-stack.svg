<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="110" viewBox="0 0 560 110" role="img" aria-label="Tech Stack">
<title>Tech Stack</title>
<defs>
<style>@font-face{font-family:'SyCaps';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.35) rotate(0deg);opacity:.25}50%{transform:scale(1) rotate(25deg);opacity:1}}
.sway{animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.swing{animation:swing 5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.rise{animation:rise 11s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}80%{opacity:.45}100%{transform:translateY(-190px);opacity:0}}
.shine{animation:shine 5s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-160px)}55%,100%{transform:translateX(720px)}}
</style>

<linearGradient id="bandG" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#C94A7D"/><stop offset=".5" stop-color="#E2759F"/><stop offset="1" stop-color="#C94A7D"/>
</linearGradient>
<linearGradient id="bandV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
  <stop offset="1" stop-color="#7E1F48" stop-opacity=".18"/>
</linearGradient>
<linearGradient id="endG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#C24577"/><stop offset="1" stop-color="#A83564"/>
</linearGradient>
<linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="tshadow" x="-5%" y="-30%" width="110%" height="160%">
  <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#6E1A3F" flood-opacity=".55"/>
</filter>
<filter id="bshadow" x="-5%" y="-20%" width="110%" height="150%">
  <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9E2F60" flood-opacity=".25"/>
</filter>
<clipPath id="bandClip"><path d="M70 26Q280 8 490 26V74Q280 56 70 74Z"/></clipPath>
<path id="tpath" d="M70 58Q280 40 490 58"/>

</defs>

<g filter="url(#bshadow)">
  <path d="M16 40H96V88H16L34 64Z" fill="url(#endG)"/>
  <path d="M544 40H464V88H544L526 64Z" fill="url(#endG)"/>
  <path d="M70 74L96 71.9V88Z" fill="#7E1F48"/>
  <path d="M490 74L464 71.9V88Z" fill="#7E1F48"/>
  <path d="M70 26Q280 8 490 26V74Q280 56 70 74Z" fill="url(#bandG)"/>
</g>
<path d="M22 46H90M22 82H90M470 46H538M470 82H538" stroke="#fff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M70 26Q280 8 490 26V74Q280 56 70 74Z" fill="url(#bandV)"/>
<g clip-path="url(#bandClip)"><g class="shine"><rect x="0" y="0" width="90" height="110" fill="url(#shineG)" transform="skewX(-20)"/></g></g>
<path d="M78 32Q280 14 482 32M78 68Q280 50 482 68" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2" stroke-dasharray="5 4"/>
<text style="font-family:'SyCaps','Cinzel','Trajan Pro',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:5px" fill="#fff" filter="url(#tshadow)"><textPath xlink:href="#tpath" startOffset="50%" text-anchor="middle">TECH STACK</textPath></text>
<g transform="translate(10 22) scale(0.90)"><path class="tw" style="animation-delay:0s;animation-duration:3.0s" fill="#D9A15F" d="M0 -10C1.2 -2.6 2.6 -1.2 10 0C2.6 1.2 1.2 2.6 0 10C-1.2 2.6 -2.6 1.2 -10 0C-2.6 -1.2 -1.2 -2.6 0 -10Z"/></g><g transform="translate(550 22) scale(0.90)"><path class="tw" style="animation-delay:-1.5s;animation-duration:3.0s" fill="#D9A15F" d="M0 -10C1.2 -2.6 2.6 -1.2 10 0C2.6 1.2 1.2 2.6 0 10C-1.2 2.6 -2.6 1.2 -10 0C-2.6 -1.2 -1.2 -2.6 0 -10Z"/></g><g transform="translate(36 102) scale(0.60)"><path class="tw" style="animation-delay:-0.7s;animation-duration:3.0s" fill="#D9578A" d="M0 -10C1.2 -2.6 2.6 -1.2 10 0C2.6 1.2 1.2 2.6 0 10C-1.2 2.6 -2.6 1.2 -10 0C-2.6 -1.2 -1.2 -2.6 0 -10Z"/></g><g transform="translate(524 102) scale(0.60)"><path class="tw" style="animation-delay:-2.2s;animation-duration:3.0s" fill="#D9578A" d="M0 -10C1.2 -2.6 2.6 -1.2 10 0C2.6 1.2 1.2 2.6 0 10C-1.2 2.6 -2.6 1.2 -10 0C-2.6 -1.2 -1.2 -2.6 0 -10Z"/></g>

</svg>
