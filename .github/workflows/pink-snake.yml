name: 🎀 Pink Snake

# Membuat animasi "ular pink" yang memakan kotak kontribusi GitHub,
# lalu menyimpannya di branch `output` supaya bisa ditampilkan di README.
on:
  schedule:
    - cron: "0 0 * * *" # setiap hari jam 07.00 WIB
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate pink snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pink-snake.svg?color_snake=#d9578a&color_dots=#fbe7ef,#f7c6d9,#f09cbb,#e2759f,#c94a7d
            dist/pink-snake-dark.svg?palette=github-dark&color_snake=#f7a8c4&color_dots=#2a1d24,#5c2a45,#8f3d68,#c4578c,#f48fb1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
